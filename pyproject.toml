[build-system]
# Pure Python now.  The CUDA extension used to be built by this project's own
# setup.py against the vendored groundingdino/ tree; it comes from the
# groundingdino-py-cuda conda package instead, so there is nothing left to
# compile and no reason to keep setuptools' build machinery.
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
# This project is SelectiveTracking.  It called itself `groundingdino` only
# because it was built from GroundingDINO's own pyproject, which is exactly the
# confusion the split removes.
name = "selectivetracking"
version = "0.1.0"
description = "Selective multi-object tracking with open-vocabulary detection"
authors = [
    {name = "Di Yao", email = "di.yao@vanderbilt.edu"},
]
license = {file = "LICENSE"}
readme = "README.md"
requires-python = ">=3.10"

# Deliberately empty.  This is an application, installed as an editable package
# into a pixi environment, and [tool.pixi.dependencies] below is the single
# authoritative dependency list.
#
# Stating them here as well makes pixi resolve the same names a second time
# against PyPI, which fails and would be wrong even if it succeeded:
#
#   * groundingdino-py on PyPI is 0.4.0 and does not carry the fixes this
#     project contributed.  The 0.4.1 that does comes from the conda feedstock,
#     and will only reach PyPI when upstream cuts a release.
#   * torch from PyPI beside pytorch from conda puts two builds of the same
#     library in one environment.
dependencies = []

[tool.hatch.build.targets.wheel]
# `groundingdino/` is deliberately absent.  What survives there is two model
# config files, read by path at run time, belonging to no package -- and the
# directory has no `__init__.py`, so it stays a namespace portion that loses to
# the installed regular package.  Shipping it would put a second `groundingdino`
# on sys.path.
packages = ["eval", "tracker", "utils", "helper"]

# ── pixi ─────────────────────────────────────────────────────────────────────
# Merged from the standalone pixi.toml, which is deleted.  One file now
# describes this project to both pip and pixi; two files stating the same
# dependency set is how they drift apart.

[tool.pixi.workspace]
authors = ["Di Yao <di.yao@vanderbilt.edu>"]
# The local channel carries groundingdino-py until the feedstock publishes it.
#
# The `pytorch` and `nvidia` channels are gone, and with them the
# `channel-priority = "disabled"` that pixi.toml needed to make the three
# co-exist.  groundingdino-py-cuda is built against conda-forge's CUDA pytorch,
# so pulling pytorch from the `pytorch` channel would put two different builds
# of the same library in one environment.  One channel, one pytorch.
channels = ["./../local-channel", "conda-forge"]
name = "selectivetracking"
version = "0.1.0"

# The CUDA requirement rides on the platform entry; the [system-requirements]
# table pixi.toml used for it is deprecated.
platforms = [{ platform = "linux-64", linux = "5.15", cuda = "12.1" }]

[tool.pixi.pypi-dependencies]
selectivetracking = { path = ".", editable = true }
cython_bbox = "*"
clip = "*"

[tool.pixi.dependencies]
python = "3.10.*"
pip = ">=26.0.1,<27"

# The detector, as a package.  `groundingdino-py` is the detector itself, pure
# Python; `-cuda` adds the compiled deformable-attention extension.
#
# On a machine with no NVIDIA GPU, drop the `-cuda` line -- that is all.  The
# model then takes the pure-PyTorch fallback, which is correct but slow, and must
# stay in float32 since grid_sample has no half-precision CPU kernel.
groundingdino-py = ">=0.4.1"
groundingdino-py-cuda = "*"

# groundingdino-py-cuda already requires `pytorch *cuda*`, so the CUDA build is
# selected by the detector rather than pinned here.  `pytorch-cuda` is gone: it
# is the `pytorch` channel's way of expressing this, and conda-forge uses the
# build string plus `cuda-version` instead.
pytorch = ">=2.1.0"
torchvision = "*"

# The build toolchain that used to live here -- cuda-nvcc, cuda-toolkit,
# gxx_linux-64, ninja, and the libcublas / libcusolver / libcusparse / libcurand
# -dev packages -- is gone.  It was here only to compile the vendored extension,
# and the package ships that already built.
numpy = ">=1.26.2"
opencv = "*"
timm = "*"
transformers = ">=4.49.0"
supervision = ">=0.22.0"
ipykernel = "*"
lap = "*"
pandas = "*"
motmetrics = "*"
accelerate = "*"
einops = "*"
addict = "*"
yapf = "*"
pycocotools = "*"

[tool.pixi.tasks.demo]
cmd = "python3 demo/inference_w_worker.py --video ../videos/carla1.mp4 --output ../output_2/annotated.mp4 --text-prompt \"red car.\" --fp16"
description = "Run inference on a sample CARLA video with the 'red car' prompt"

[tool.pixi.tasks.cuda-check]
cmd = "python3 scripts/cuda-check.py"
description = "Verify CUDA availability and print GPU/driver info"

[tool.pixi.tasks.nuclear]
cmd = "bash scripts/nu-clear.sh"
description = "Remove all build artifacts and caches for a clean slate"

# `build` is gone with setup.py: there is no extension to compile here any more.
# `conda-build` is gone too -- recipe.yaml built the detector, which the
# feedstock now owns.
