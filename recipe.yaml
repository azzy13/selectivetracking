schema_version: 1

package:
  name: groundingdino
  version: 0.1.0

source:
  - path: .

build:
  number: 0
  script:
    content:
      - pip install --no-deps --no-build-isolation .
    env:
      FORCE_CUDA: "1"
      CUDA_HOME: $CONDA_PREFIX
      CPATH: $CONDA_PREFIX/include
      LIBRARY_PATH: $CONDA_PREFIX/lib
      LDFLAGS: "-L$CONDA_PREFIX/lib -Wl,-rpath,$CONDA_PREFIX/lib"
      TORCH_CUDA_ARCH_LIST: "8.0;8.6;8.9"
  python:
    entry_points: []

requirements:
  build:
    - ${{ compiler('c') }}
    - ${{ compiler('cxx') }}
    - cuda-nvcc 12.1.*
  host:
    - python >=3.10
    - pip
    - setuptools >=82.0.1,<83
    - wheel
    - setuptools_scm
    - ninja >=1.13.2,<2
    - pytorch >=2.1.0
    - cuda-toolkit 12.1.*
    - cuda-nvcc 12.1.*
    - cuda-cudart-dev >=12.1.105,<13
  run:
    - python >=3.10
    - pytorch >=2.1.0
    - torchvision
    - numpy >=1.26.2
    - opencv
    - supervision >=0.22.0
    - pycocotools
    - transformers >=4.49.0
    - addict
    - yapf
    - timm

about:
  summary: Open-set object detector
  license: Apache-2.0
  license_file: LICENSE
  homepage: https://github.com/IDEA-Research/GroundingDINO
